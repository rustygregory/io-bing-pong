<!DOCTYPE html>
<html>
<head>
<title>Bing Pong!</title>
<style>
  body { margin: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
  #game { border: 2px solid #fff; }
  #fireworks { border: none; }
  button { margin-top: 16px; padding: 8px 24px; font: 18px monospace; background: #333; color: #fff; border: 2px solid #fff; cursor: pointer; }
  button:hover { background: #555; }
</style>
</head>
<body>
<canvas id="fireworks" width="800" height="100"></canvas>
<canvas id="game" width="800" height="400"></canvas>
<div style="display:flex;gap:24px;align-items:center"><button id="pause">Pause</button><button id="reset">Reset</button><button id="cracra">Cra Cra Play</button><button id="mute"><svg width="20" height="18" viewBox="0 0 20 18" fill="none"><rect x="1" y="6" width="4" height="6" fill="#fff"/><polygon points="5,6 11,2 11,16 5,12" fill="#fff"/><rect id="snd1" x="13" y="5" width="2" height="8" fill="#fff"/><rect id="snd2" x="16" y="3" width="2" height="12" fill="#fff"/></svg></button></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const fwCanvas = document.getElementById('fireworks');
const fwCtx = fwCanvas.getContext('2d');

const paddle = { w: 10, h: 80 };
const player = { x: 20, y: 160, score: 0 };
const ai = { x: 770, y: 160, score: 0 };
const ball = { x: 400, y: 200, dx: 4, dy: 3, r: 12, flashColor: null, flashTimer: 0 };
const flashColors = ['#f0f', '#0ff', '#ff0', '#f90', '#0f0', '#f44'];

let muted = false;
let paused = false;
let scorePause = false;
let countdown = 0;
const maxScore = 7;
let playerSets = 0;
let aiSets = 0;
let particles = [];
let craCraMode = false;
const obstacles = [];
const obstacleMaxR = ball.r * 2.5;

function initObstacles() {
  obstacles.length = 0;
  const leftX = [120, 200, 160];
  const rightX = [640, 600, 680];
  const ys = [80, 200, 320];
  for (let i = 0; i < 3; i++) {
    obstacles.push({ x: leftX[i], y: ys[i], solid: false, r: obstacleMaxR, baseX: leftX[i], baseY: ys[i], dx: (Math.random() - 0.5) * 0.5, dy: (Math.random() - 0.5) * 0.5, side: 'left' });
    obstacles.push({ x: rightX[i], y: ys[i], solid: false, r: obstacleMaxR, baseX: rightX[i], baseY: ys[i], dx: (Math.random() - 0.5) * 0.5, dy: (Math.random() - 0.5) * 0.5, side: 'right' });
  }
}

function randomizeObstacles() {
  const leftIndices = [0, 1, 2].sort(() => Math.random() - 0.5);
  const rightIndices = [0, 1, 2].sort(() => Math.random() - 0.5);
  const leftSolid = leftIndices.slice(0, Math.floor(Math.random() * 2) + 1);
  const rightSolid = rightIndices.slice(0, Math.floor(Math.random() * 2) + 1);

  let li = 0, ri = 0;
  for (let i = 0; i < obstacles.length; i++) {
    const o = obstacles[i];
    if (o.side === 'left') {
      o.solid = leftSolid.includes(li);
      li++;
    } else {
      o.solid = rightSolid.includes(ri);
      ri++;
    }
    o.r = (Math.random() * 0.6 + 0.4) * obstacleMaxR;
    o.dx = (Math.random() - 0.5) * 0.5;
    o.dy = (Math.random() - 0.5) * 0.5;
  }
}

function updateObstacles() {
  for (const o of obstacles) {
    o.x += o.dx;
    o.y += o.dy;
    if (Math.abs(o.x - o.baseX) > 30) o.dx *= -1;
    if (Math.abs(o.y - o.baseY) > 30) o.dy *= -1;
  }
}

setInterval(randomizeObstacles, 2000);

const fwColors = ['#ff0', '#f0f', '#0ff', '#f90', '#0f0', '#f44'];
let fwColorIndex = 0;

function spawnFirework(x) {
  const color = fwColors[fwColorIndex % fwColors.length];
  for (let i = 0; i < 25; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;
    const speed = Math.random() * 1.5 + 0.8;
    particles.push({
      x, y: 100,
      dx: Math.cos(angle) * speed,
      dy: Math.sin(angle) * speed,
      life: 90 + Math.random() * 40,
      color
    });
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

function playBounce(type) {
  if (muted) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
  osc.connect(gain).connect(audioCtx.destination);

  if (type === 'wall') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, now);
  } else if (type === 'paddle') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, now);
  } else {
    osc.type = 'square';
    osc.frequency.setValueAtTime(330, now);
    gain.gain.setValueAtTime(0.2, now);
  }

  osc.start(now);
  osc.stop(now + 0.08);
}

function playScoreSound() {
  if (muted) return;
  const now = audioCtx.currentTime;

  const osc1 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain();
  osc1.type = 'square';
  osc1.frequency.setValueAtTime(440, now);
  gain1.gain.setValueAtTime(0.3, now);
  gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc1.connect(gain1).connect(audioCtx.destination);
  osc1.start(now);
  osc1.stop(now + 0.15);

  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(660, now + 0.15);
  gain2.gain.setValueAtTime(0.3, now + 0.15);
  gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.9);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start(now + 0.15);
  osc2.stop(now + 0.9);
}

function celebrate() {
  scorePause = true;
  let count = 0;
  const interval = setInterval(() => {
    fwColorIndex++;
    spawnFirework(100 + Math.random() * 600);
    count++;
    if (count >= 5) {
      clearInterval(interval);
      setTimeout(() => { scorePause = false; }, 1500);
    }
  }, 300);
}

function scored(side) {
  fwColorIndex++;
  playScoreSound();
  if (side === 'player') {
    spawnFirework(200);
    spawnFirework(300);
  } else {
    spawnFirework(500);
    spawnFirework(600);
  }
  scorePause = true;
  setTimeout(() => { scorePause = false; }, 2000);
}
document.getElementById('mute').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('snd1').setAttribute('fill', muted ? '#555' : '#fff');
  document.getElementById('snd2').setAttribute('fill', muted ? '#555' : '#fff');
});

document.getElementById('cracra').addEventListener('click', () => {
  craCraMode = !craCraMode;
  document.getElementById('cracra').textContent = craCraMode ? 'Normal Play' : 'Cra Cra Play';
  if (craCraMode) {
    initObstacles();
    randomizeObstacles();
  }
});

function playCountdownBeep(pitch) {
  if (muted) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(pitch, now);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.3);
}

document.getElementById('pause').addEventListener('click', () => {
  if (paused) {
    countdown = 3;
    document.getElementById('pause').textContent = 'Pause';
    playCountdownBeep(330);
    const tick = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(tick);
        paused = false;
      } else if (countdown === 2) {
        playCountdownBeep(440);
      } else if (countdown === 1) {
        playCountdownBeep(550);
      }
    }, 1000);
  } else {
    paused = true;
    document.getElementById('pause').textContent = 'Resume';
  }
});

document.getElementById('reset').addEventListener('click', () => {
  player.score = 0;
  ai.score = 0;
  playerSets = 0;
  aiSets = 0;
  player.y = 160;
  ai.y = 160;
  ball.dx = 4;
  ball.dy = 3;
  reset();
  paused = false;
  document.getElementById('pause').textContent = 'Pause';
});

document.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  player.y = e.clientY - rect.top - paddle.h / 2;
  player.y = Math.max(0, Math.min(400 - paddle.h, player.y));
});

function reset() {
  ball.x = 400;
  ball.y = 200;
  ball.dx = ball.dx > 0 ? -4 : 4;
  ball.dy = 3 * (Math.random() > 0.5 ? 1 : -1);
}

function update() {
  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.y - ball.r <= 0 || ball.y + ball.r >= 400) { ball.dy *= -1; playBounce('wall'); }

  // AI movement
  const aiCenter = ai.y + paddle.h / 2;
  if (aiCenter < ball.y - 20) ai.y += 3;
  else if (aiCenter > ball.y + 20) ai.y -= 3;

  // Player paddle collision
  if (ball.x - ball.r <= player.x + paddle.w && ball.y >= player.y && ball.y <= player.y + paddle.h && ball.dx < 0) {
    ball.dx *= -1.08;
    ball.dy += (ball.y - (player.y + paddle.h / 2)) * 0.1;
    ball.flashColor = flashColors[Math.floor(Math.random() * flashColors.length)];
    ball.flashTimer = 30;
    playBounce('paddle');
  }

  // AI paddle collision
  if (ball.x + ball.r >= ai.x && ball.y >= ai.y && ball.y <= ai.y + paddle.h && ball.dx > 0) {
    ball.dx *= -1.08;
    ball.dy += (ball.y - (ai.y + paddle.h / 2)) * 0.1;
    ball.flashColor = flashColors[Math.floor(Math.random() * flashColors.length)];
    ball.flashTimer = 30;
    playBounce('paddle');
  }

  // Obstacle collisions
  if (craCraMode) {
    for (const o of obstacles) {
      if (!o.solid) continue;
      const dx = ball.x - o.x;
      const dy = ball.y - o.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < ball.r + o.r) {
        const nx = dx / dist;
        const ny = dy / dist;
        const dot = ball.dx * nx + ball.dy * ny;
        ball.dx -= 2 * dot * nx;
        ball.dy -= 2 * dot * ny;
        ball.x = o.x + nx * (ball.r + o.r + 1);
        ball.y = o.y + ny * (ball.r + o.r + 1);
        ball.dx *= 1.06;
        ball.dy *= 1.06;
        playBounce('obstacle');
      }
    }
  }

  // Scoring
  if (ball.x < 0) {
    ai.score++;
    reset(); scored('ai');
    if (ai.score % 3 === 0) celebrate();
  }
  if (ball.x > canvas.width) {
    player.score++;
    reset(); scored('player');
    if (player.score % 3 === 0) celebrate();
  }
}


function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 1;

  // Center line
  ctx.beginPath();
  ctx.moveTo(400, 0);
  ctx.lineTo(400, 400);
  ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(400, 200, 60, 0, Math.PI * 2);
  ctx.stroke();

  // Outer boundary
  ctx.beginPath();
  ctx.rect(40, 10, 720, 380);
  ctx.stroke();

  // Left penalty box
  ctx.beginPath();
  ctx.rect(40, 120, 100, 160);
  ctx.stroke();

  // Right penalty box
  ctx.beginPath();
  ctx.rect(660, 120, 100, 160);
  ctx.stroke();

  // Left goal box
  ctx.beginPath();
  ctx.rect(40, 160, 40, 80);
  ctx.stroke();

  // Right goal box
  ctx.beginPath();
  ctx.rect(720, 160, 40, 80);
  ctx.stroke();

  ctx.setLineDash([]);
  ctx.lineWidth = 1;

  ctx.fillStyle = '#fff';
  ctx.fillRect(player.x, player.y, paddle.w, paddle.h);
  ctx.fillRect(ai.x, ai.y, paddle.w, paddle.h);

  if (ball.flashTimer > 0) {
    ctx.fillStyle = ball.flashColor;
    ball.flashTimer--;
  }
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();

  // Draw obstacles
  if (craCraMode) {
    for (const o of obstacles) {
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      if (o.solid) {
        ctx.fillStyle = '#556';
        ctx.fill();
      } else {
        ctx.strokeStyle = '#334';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  ctx.fillStyle = '#fff';
  ctx.font = '32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(player.score, 300, 40);
  ctx.fillText(ai.score, 500, 40);

}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx;
    p.y += p.dy;
    p.dy -= 0.05;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  fwCtx.fillStyle = '#000';
  fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
  for (const p of particles) {
    fwCtx.globalAlpha = p.life / 80;
    fwCtx.fillStyle = p.color;
    const px = Math.round(p.x / 8) * 8;
    const py = Math.round(p.y / 8) * 8;
    fwCtx.fillRect(px, py, 8, 8);
  }
  fwCtx.globalAlpha = 1;


  if (countdown > 0) {
    fwCtx.font = '64px monospace';
    fwCtx.fillStyle = '#fff';
    fwCtx.textAlign = 'center';
    fwCtx.fillText(countdown, 400, 75);
  }
}

function loop() {
  if (!paused && !scorePause) update();
  if (craCraMode) updateObstacles();
  updateParticles();
  draw();
  drawParticles();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
